<style>
/* Layout: one-screen app — score bar on top, physics board filling the rest; the image library slides up as a sheet. */
:root{
  --bg:#e9efe6; --panel:#ffffff; --panel-2:#f1f6ef; --panel-3:#e3ebe1;
  --ink:#1b2620; --muted:#5e6f68; --hair:#cfdbcd;
  --board:#fdfaf2; --board-ring:#cfe0d2;
  --accent:#d93347; --accent-2:#2f9e5e; --gold:#dd9b14;
  --shadow:0 8px 22px rgba(24,38,30,.13);
  --font-display:"Baloo 2","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a17; --panel:#1b2420; --panel-2:#222d28; --panel-3:#2b3732;
    --ink:#e7efe9; --muted:#9bada5; --hair:#33423b;
    --board:#0e1512; --board-ring:#2c4135;
    --accent:#ff5a6b; --accent-2:#45c57c; --gold:#f0b53c;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a17; --panel:#1b2420; --panel-2:#222d28; --panel-3:#2b3732;
  --ink:#e7efe9; --muted:#9bada5; --hair:#33423b;
  --board:#0e1512; --board-ring:#2c4135;
  --accent:#ff5a6b; --accent-2:#45c57c; --gold:#f0b53c;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  overflow:hidden; -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{
  height:100%; display:flex; flex-direction:column; gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px;
  max-width:560px; margin:0 auto;
}

/* --- score bar --- */
.bar{display:flex;align-items:center;gap:10px}
.scores{display:flex;gap:8px;flex:1;min-width:0}
.stat{
  background:var(--panel); border-radius:14px; padding:7px 12px 8px; box-shadow:var(--shadow);
  min-width:0; flex:1;
}
.stat .k{font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat .v{
  font-family:var(--font-display); font-weight:800; font-size:26px; line-height:1.05;
  font-variant-numeric:tabular-nums; letter-spacing:.01em;
}
.stat.best .v{color:var(--gold)}
.tools{display:flex;gap:6px}
.icon{
  width:40px;height:40px;border:1px solid var(--hair);background:var(--panel);
  border-radius:13px;display:grid;place-items:center;font-size:17px;box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.icon:active{transform:scale(.93)}
.icon.off{opacity:.45}

/* --- board --- */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
canvas{
  display:block; max-width:100%; max-height:100%; aspect-ratio:420/560;
  border-radius:20px; background:var(--board);
  box-shadow:var(--shadow), 0 0 0 2px var(--board-ring) inset;
  touch-action:none; cursor:pointer;
}
.over{
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
}
.over-card{
  pointer-events:auto; text-align:center; background:var(--panel); border-radius:20px;
  padding:22px 26px; box-shadow:var(--shadow); border:1px solid var(--hair);
  animation:pop .28s cubic-bezier(.2,1.5,.5,1) both;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.over-card h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:800;text-wrap:balance}
.over-card .big{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;color:var(--accent)}
.over-card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.btn{
  border:none;background:var(--accent);color:#fff;border-radius:13px;
  padding:11px 22px;font-family:var(--font-display);font-weight:700;font-size:16px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--panel-3);color:var(--ink);box-shadow:none}

.disc{
  border:none;padding:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:var(--panel-2); position:relative;
}
.disc img{width:100%;height:100%;object-fit:cover;display:block}
.disc .em{font-family:var(--emoji);line-height:1}

/* --- sheet --- */
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(10,18,14,.5)}
.sheet-card{
  background:var(--bg); border-radius:22px 22px 0 0; width:100%; max-width:560px; margin:0 auto;
  max-height:88vh; overflow:auto; box-shadow:0 -10px 40px rgba(0,0,0,.3);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .26s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:800}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sheet-head .btn{padding:8px 16px;font-size:14px;margin-left:auto}
.hint{color:var(--muted);font-size:12.5px;line-height:1.55;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{
  background:var(--panel);border:1px solid var(--hair);border-radius:15px;padding:10px;
  display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;
}
.tile.drop{border-color:var(--accent-2);background:var(--panel-2)}
.tile .disc{width:62px;height:62px;cursor:pointer;box-shadow:0 0 0 1px var(--hair) inset}
.tile .disc .em{font-size:32px}
.tname{font-size:12.5px;text-align:center;min-width:0;line-height:1.3}
.tname b{font-weight:600}
.tname span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.acts{display:flex;gap:5px;width:100%}
.mini{
  flex:1;border:1px solid var(--hair);background:var(--panel-2);border-radius:9px;
  padding:5px 2px;font-size:11.5px;text-align:center;min-width:0;
}
.mini.on{background:var(--accent-2);border-color:transparent;color:#fff}
.sheet-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.sheet-foot .note{color:var(--muted);font-size:11.5px;flex:1;min-width:0}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important}}
</style>
</head>

<div class="app">
  <div class="bar">

    </div>
  </div>

</div>

<div class="sheet" id="sheet" hidden>

    <div class="sheet-head">

    </div>

    <div class="grid" id="tierGrid"></div>
    <div class="sheet-foot">
      <button class="mini" id="btnClearAll" style="flex:0 0 auto;padding:7px 14px">全部恢复默认</button>
      <span class="note" id="storeNote"></span>
    </div>
  </div>
</div>

var defEls={};
var SPAWNABLE=5;            // 只会掉出最小的 5 级
var LS_IMG='dxg.images.v1', LS_BEST='dxg.best.v1', LS_SND='dxg.sound.v1';

/* ---------- state ---------- */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var dpr=1, scale=1;
var engine, fruits=[], parts=[], mergeQ=[];
var score=0, best=0, nextTier=0, aimX=W/2, canDrop=true, dropAt=0, dead=false;
var sound=true, images={}, imgEls={}, theme={};
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage ---------- */
function load(){
  try{
    var raw=localStorage.getItem(LS_IMG);
    if(raw) images=JSON.parse(raw)||{};
    best=parseInt(localStorage.getItem(LS_BEST)||'0',10)||0;
    sound=localStorage.getItem(LS_SND)!=='0';
  }catch(e){ images={}; }
  Object.keys(images).forEach(function(k){ makeImg(k, images[k]); });
}
function saveImages(){
  try{ localStorage.setItem(LS_IMG, JSON.stringify(images)); note(''); return true; }
  catch(e){ note('这台设备的浏览器存不下更多图片了，先清掉几张再上传。'); return false; }
}
function saveBest(){ try{ localStorage.setItem(LS_BEST,String(best)); }catch(e){} }
function note(t){
  var n=document.getElementById('storeNote'); if(!n) return;
  if(t){ n.textContent=t; return; }
  var miss=[];
  for(var i=0;i<TIERS.length;i++) if(!images[i]&&!ART[i]) miss.push(i+1);
  n.textContent = miss.length
    ? ('还差 '+miss.length+' 级：第 '+miss.join('、')+' 级，现在先用 emoji 顶着')
    : '11 级都有照片了';
}

function makeImg(tier, url){
  var im=new Image(); im.decoding='async';
  im.onload=function(){ imgEls[tier]=im; };
  im.onerror=function(){ delete imgEls[tier]; };
  im.src=url;
}

/* ---------- theme tokens for canvas ---------- */
function refreshTheme(){
  var cs=getComputedStyle(document.documentElement);
  theme={
    board:cs.getPropertyValue('--board').trim(),
    ring:cs.getPropertyValue('--board-ring').trim(),
    accent:cs.getPropertyValue('--accent').trim(),
    muted:cs.getPropertyValue('--muted').trim(),
    ink:cs.getPropertyValue('--ink').trim()
  };
}

/* ---------- world ---------- */
function buildWorld(){
  engine=Engine.create();
  engine.gravity.y=1.15;
  engine.positionIterations=8;
  engine.velocityIterations=8;
  var wo={isStatic:true, friction:.5, restitution:.05, label:'wall'};
  Composite.add(engine.world,[
    Bodies.rectangle(-40,H/2,80,H*3,wo),
    Bodies.rectangle(W+40,H/2,80,H*3,wo),
    Bodies.rectangle(W/2,H+40,W*3,80,wo)
  ]);
  Events.on(engine,'collisionStart',onHit);
  Events.on(engine,'afterUpdate',flushMerges);
  fruits=[]; parts=[]; mergeQ=[];
}

function addFruit(tier,x,y,ang){
  var r=RAD[tier];
  var b=Bodies.circle(x,y,r,{
    restitution:.1, friction:.45, frictionStatic:.7, frictionAir:.004,
    density:.0013, slop:.02, label:'fruit'
  });
  b.isFruit=true; b.tier=tier; b.birth=performance.now(); b.overSince=null; b.hasLanded=false;
  if(ang) Body.setAngle(b,ang);
  Composite.add(engine.world,b);
  fruits.push(b);
  return b;
}
function removeFruit(b){
  Composite.remove(engine.world,b);
  var i=fruits.indexOf(b); if(i>=0) fruits.splice(i,1);
}

function onHit(ev){
  for(var i=0;i<ev.pairs.length;i++){
    var a=ev.pairs[i].bodyA, b=ev.pairs[i].bodyB;
    if(a.isFruit) a.hasLanded=true;
    if(b.isFruit) b.hasLanded=true;
    if(!a.isFruit||!b.isFruit) continue;
    if(a.tier!==b.tier||a.merged||b.merged) continue;
    a.merged=b.merged=true;
    mergeQ.push([a,b]);
  }
}
function flushMerges(){
  while(mergeQ.length){
    var pr=mergeQ.shift(), a=pr[0], b=pr[1], t=a.tier;
    var x=(a.position.x+b.position.x)/2, y=(a.position.y+b.position.y)/2;
    removeFruit(a); removeFruit(b);
    if(t<MAX){
      var nb=addFruit(t+1,x,y);
      Body.setVelocity(nb,{x:0,y:-1.2});
      score+=PTS[t+1];
      burst(x,y,TIERS[t+1].c,10+t*2);
      blip(t);
    }else{
      score+=120;
      burst(x,y,TIERS[MAX].c,40);
      burst(x,y,'#ffffff',18);
      blip(MAX); blip(MAX-3);
    }
    paintScore();
  }
}

function burst(x,y,color,n){
  if(reduce) n=Math.min(n,4);
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=1.4+Math.random()*4.2;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:color,r:2+Math.random()*4});
  }
}

/* ---------- sound ---------- */
var actx=null;
function blip(tier){
  if(!sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='triangle';
    o.frequency.setValueAtTime(760-tier*48,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(90,420-tier*34),t+.14);
    g.gain.setValueAtTime(.001,t);
    g.gain.exponentialRampToValueAtTime(.16,t+.012);
    g.gain.exponentialRampToValueAtTime(.0008,t+.2);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.22);
  }catch(e){}
}

/* ---------- drop ---------- */
function pickNext(){ return Math.floor(Math.random()*SPAWNABLE); }
function clampAim(tier){
  var r=RAD[tier]+3;
  aimX=Math.max(r,Math.min(W-r,aimX));
}
function drop(){
  if(dead||!canDrop) return;
  clampAim(nextTier);
  var b=addFruit(nextTier,aimX,DROP_Y);
  Body.setVelocity(b,{x:0,y:1.5});
  canDrop=false; dropAt=performance.now();
  nextTier=pickNext();
}

/* ---------- loop ---------- */
var last=0, acc=0;
function frame(now){
  if(!last) last=now;
  var dt=Math.min(now-last,60); last=now; acc+=dt;
  while(acc>=16.666){ Engine.update(engine,16.666); acc-=16.666; }
  if(!canDrop && now-dropAt>420) canDrop=true;
  stepParts(dt);
  if(!dead) checkDeath(now);
  draw(now);
  requestAnimationFrame(frame);
}
function stepParts(dt){
  var k=dt/16.666;
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*k; p.y+=p.vy*k; p.vy+=.22*k; p.vx*=.99; p.life-=.022*k;
    if(p.life<=0) parts.splice(i,1);
  }
}
var danger=false;
function checkDeath(now){
  danger=false;
  for(var i=0;i<fruits.length;i++){
    var b=fruits[i];
    if(!b.hasLanded){ b.overSince=null; continue; }
    var sp=Math.sqrt(b.velocity.x*b.velocity.x+b.velocity.y*b.velocity.y);
    var top=b.position.y-RAD[b.tier];
    if(top<LINE_Y && sp<1.3 && now-b.birth>600){
      if(b.overSince==null) b.overSince=now;
      danger=true;
      if(now-b.overSince>1200){ gameOver(); return; }
    }else{
      b.overSince=null;
    }
  }
}

/* ---------- draw ---------- */
function draw(now){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var s=dpr*scale;
  ctx.setTransform(s,0,0,s,0,0);

  ctx.fillStyle=theme.board; ctx.fillRect(0,0,W,H);

  // danger line
  var pulse=danger?(.45+.4*Math.sin(now/160)):.22;
  ctx.save();
  ctx.setLineDash([9,8]); ctx.lineWidth=2;
  ctx.globalAlpha=pulse;
  ctx.strokeStyle=danger?theme.accent:theme.ring;
  ctx.beginPath(); ctx.moveTo(10,LINE_Y); ctx.lineTo(W-10,LINE_Y); ctx.stroke();
  ctx.restore();

  // aim guide
  if(!dead){
    ctx.save();
    ctx.globalAlpha=.2; ctx.setLineDash([4,9]); ctx.lineWidth=2; ctx.strokeStyle=theme.ink;
    ctx.beginPath(); ctx.moveTo(aimX,DROP_Y+RAD[nextTier]); ctx.lineTo(aimX,H-6); ctx.stroke();
    ctx.restore();
  }

  for(var i=0;i<fruits.length;i++){
    var b=fruits[i];
    drawFruit(b.tier,b.position.x,b.position.y,RAD[b.tier],b.angle);
  }

  // the fruit waiting to be dropped
  if(!dead){
    clampAim(nextTier);
    var bob=reduce?0:Math.sin(now/420)*2.5;
    ctx.save(); ctx.globalAlpha=canDrop?1:.4;
    drawFruit(nextTier,aimX,DROP_Y+bob,RAD[nextTier],0);
    ctx.restore();
  }

  for(var j=0;j<parts.length;j++){
    var p=parts[j];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFruit(tier,x,y,r,ang){
  var t=TIERS[tier], im=imgEls[tier]||defEls[tier];
  ctx.save();
  ctx.translate(x,y); ctx.rotate(ang||0);
  ctx.beginPath(); ctx.arc(0,0,r,0,6.2832);
  if(im){
    ctx.save(); ctx.clip();
    var iw=im.naturalWidth||1, ih=im.naturalHeight||1, k=Math.max(2*r/iw,2*r/ih);
    ctx.drawImage(im,-iw*k/2,-ih*k/2,iw*k,ih*k);
    ctx.restore();
    ctx.lineWidth=Math.max(1.5,r*.05); ctx.strokeStyle='rgba(0,0,0,.14)'; ctx.stroke();
  }else{
    ctx.fillStyle=t.c; ctx.fill();
    // top highlight
    var g=ctx.createRadialGradient(-r*.3,-r*.4,r*.05,0,0,r*1.15);
    g.addColorStop(0,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=Math.max(1.5,r*.05); ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.stroke();
    ctx.font=(r*1.35)+'px '+'"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.e,0,r*.04);
  }
  ctx.restore();
}

/* ---------- canvas fit ---------- */
function fit(){
  var r=cv.getBoundingClientRect();
  if(!r.width) return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr);
  cv.height=Math.round(r.height*dpr);
  scale=r.width/W;
}

/* ---------- input ---------- */
function xFromEvent(e){
  var r=cv.getBoundingClientRect();
  return (e.clientX-r.left)/(r.width/W);
}
var pressing=false;
cv.addEventListener('pointerdown',function(e){
  if(dead) return;
  pressing=true; cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  aimX=xFromEvent(e);
});
cv.addEventListener('pointermove',function(e){
  if(dead) return;
  if(pressing||e.pointerType==='mouse') aimX=xFromEvent(e);
});
cv.addEventListener('pointerup',function(e){
  if(!pressing||dead) return;
  pressing=false; aimX=xFromEvent(e); drop();
});
cv.addEventListener('pointercancel',function(){ pressing=false; });
window.addEventListener('keydown',function(e){
  if(document.getElementById('sheet').hidden===false) return;
  if(e.key==='ArrowLeft'){ aimX-=18; e.preventDefault(); }
  else if(e.key==='ArrowRight'){ aimX+=18; e.preventDefault(); }
  else if(e.key===' '||e.key==='Enter'){ dead?restart():drop(); e.preventDefault(); }
});

/* ---------- UI ---------- */
function paintScore(){
  document.getElementById('score').textContent=score;
  if(score>best){ best=score; saveBest(); }
  document.getElementById('best').textContent=best;
}
function discHTML(tier,size){
  var t=TIERS[tier], url=images[tier]||ART[tier];
  var inner = url ? '<img src="'+url+'" alt="">' : '<span class="em" style="font-size:'+Math.round(size*.56)+'px">'+t.e+'</span>';
  var bg = url ? 'var(--panel-2)' : t.c;
  return '<span class="disc d" style="width:'+size+'px;height:'+size+'px;background:'+bg+'">'+inner+'</span>';
}

function gameOver(){
  dead=true;
  document.getElementById('overTitle').textContent = score>=best&&score>0 ? '新纪录！' : '摞到顶了';
  document.getElementById('overScore').textContent = score;
  document.getElementById('overSub').textContent = '最高 '+best+' 分';
  document.getElementById('over').hidden=false;
  blip(9);
}
function restart(){
  document.getElementById('over').hidden=true;
  for(var i=fruits.length-1;i>=0;i--) Composite.remove(engine.world,fruits[i]);
  fruits=[]; parts=[]; mergeQ=[];
  score=0; dead=false; canDrop=true; danger=false;
  nextTier=pickNext(); aimX=W/2;
  paintScore();
}

document.getElementById('btnAgain').addEventListener('click',restart);
document.getElementById('btnReset').addEventListener('click',restart);
var sb=document.getElementById('btnSound');
function paintSound(){ sb.textContent=sound?'🔊':'🔇'; sb.classList.toggle('off',!sound); }
sb.addEventListener('click',function(){
  sound=!sound; paintSound();
  try{ localStorage.setItem(LS_SND, sound?'1':'0'); }catch(e){}
  if(sound) blip(4);
});

/* ---------- image library ---------- */
var sheet=document.getElementById('sheet');
document.getElementById('btnImg').addEventListener('click',function(){ sheet.hidden=false; note(''); });
document.getElementById('btnDone').addEventListener('click',function(){ sheet.hidden=true; });
sheet.addEventListener('click',function(e){ if(e.target===sheet) sheet.hidden=true; });

function buildGrid(){
  var g=document.getElementById('tierGrid'), h='';
  for(var i=0;i<TIERS.length;i++){
    var cur=images[i]||ART[i];
    h+='<div class="tile" data-tier="'+i+'">'
      +   '<button class="disc" data-pick="'+i+'" aria-label="给'+TIERS[i].n+'换图片" style="background:'+(cur?'var(--panel-2)':TIERS[i].c)+'">'
      +     (cur?'<img src="'+cur+'" alt="">':'<span class="em">'+TIERS[i].e+'</span>')
      +   '</button>'
      +   '<div class="tname"><b>'+TIERS[i].n+'</b> <span>第'+(i+1)+'级</span></div>'
      +   '<div class="acts">'
      +     '<label class="mini'+(cur?' on':'')+'" for="file'+i+'">'+(cur?'换一张':'上传')+'<input id="file'+i+'" type="file" accept="image/*" hidden></label>'
      +     (images[i]?'<button class="mini" data-clear="'+i+'">还原</button>':'')
      +   '</div>'
      + '</div>';
  }
  g.innerHTML=h;
  for(var k=0;k<TIERS.length;k++) wire(k);
  note('');
}
function wire(i){
  var inp=document.getElementById('file'+i);
  inp.addEventListener('change',function(){
    if(inp.files&&inp.files[0]) intake(i,inp.files[0]);
    inp.value='';
  });
  var pick=document.querySelector('[data-pick="'+i+'"]');
  pick.addEventListener('click',function(){ inp.click(); });
  var clr=document.querySelector('[data-clear="'+i+'"]');
  if(clr) clr.addEventListener('click',function(){
    delete images[i]; delete imgEls[i]; saveImages(); buildGrid();
  });
  var tile=document.querySelector('.tile[data-tier="'+i+'"]');
  tile.addEventListener('dragover',function(e){ e.preventDefault(); tile.classList.add('drop'); });
  tile.addEventListener('dragleave',function(){ tile.classList.remove('drop'); });
  tile.addEventListener('drop',function(e){
    e.preventDefault(); tile.classList.remove('drop');
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) intake(i,f);
  });
}
function intake(tier,file){
  if(!/^image\//.test(file.type)){ note('这个文件不是图片。'); return; }
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){ images[tier]=squash(im); if(saveImages()){ makeImg(tier,images[tier]); buildGrid(); } else { delete images[tier]; } };
    im.onerror=function(){ note('这张图片读不出来，换一张试试。'); };
    im.src=fr.result;
  };
  fr.onerror=function(){ note('读取文件失败。'); };
  fr.readAsDataURL(file);
}
// center-crop to a square and shrink, so 11 images still fit in localStorage
function squash(im){
  var S=256, c=document.createElement('canvas'); c.width=c.height=S;
  var g=c.getContext('2d');
  var iw=im.naturalWidth, ih=im.naturalHeight, side=Math.min(iw,ih);
  g.drawImage(im,(iw-side)/2,(ih-side)/2,side,side,0,0,S,S);
  var out=c.toDataURL('image/webp',.85);
  if(out.indexOf('data:image/webp')!==0) out=c.toDataURL('image/jpeg',.85);
  return out;
}
document.getElementById('btnClearAll').addEventListener('click',function(){
  images={}; imgEls={}; saveImages(); buildGrid();
});

/* ---------- boot ---------- */
function start(saved){
  load(); refreshTheme(); buildWorld();
  Object.keys(ART).forEach(function(k){ var im=new Image(); im.decoding='async'; im.onload=function(){ defEls[k]=im; }; im.src=ART[k]; });
  buildGrid();
  score=saved&&saved.score||0;
  if(saved&&typeof saved.best==='number') best=Math.max(best,saved.best);
  nextTier=(saved&&typeof saved.next==='number')?saved.next:pickNext();
  if(saved&&saved.bodies) saved.bodies.forEach(function(b){
    if(b.t>=0&&b.t<=MAX){ var f=addFruit(b.t,b.x,b.y,b.a); f.hasLanded=true; }
  });
  paintScore(); paintSound();
  fit();
  new ResizeObserver(fit).observe(cv);
  window.addEventListener('resize',fit);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',refreshTheme);
  new MutationObserver(refreshTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){
      return {score:score,best:best,next:nextTier,bodies:fruits.map(function(b){
        return {t:b.tier,x:b.position.x,y:b.position.y,a:b.angle};
      })};
    });
  }
  requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
